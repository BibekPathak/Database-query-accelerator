# ===========================================================================
#  DBQA CI pipeline.
#
#  Stages (in order of dependency):
#    1. format    Verible SystemVerilog format check
#    2. lint      Verilator --lint-only over all RTL
#    3. build     Verilator + C++20 testbench compilation
#    4. test      CTest: every self-checking testbench
#    5. formal    SymbiYosys bounded model checks (FIFO, skid register,
#                 COUNT/SUM engines)
#    6. synth     Vivado synthesis for XC7A35T      (enabled Phase 11)
#
#  Artifacts: benchmark CSVs, logs and formal/synth reports are uploaded
#  so every PR carries a machine-readable verification record.
# ===========================================================================

name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Verible format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verible
        run: |
          VERIBLE_TAG=v0.0-4117-gdd17e7fe
          VERIBLE_PKG=verible-${VERIBLE_TAG}-linux-static-x86_64
          curl -sSL \
            "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_TAG}/${VERIBLE_PKG}.tar.gz" \
            -o /tmp/verible.tar.gz
          tar -xzf /tmp/verible.tar.gz -C /tmp
          echo "/tmp/${VERIBLE_PKG}/bin" >> "${GITHUB_PATH}"
      - name: Check formatting
        run: make format-check

  lint:
    name: Verilator lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Lint RTL
        run: make lint

  build-test:
    name: Build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel "$(nproc)"
      - name: Run tests
        run: ctest --test-dir build --output-on-failure
      - name: Upload logs and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/**/*.log
            results/
          if-no-files-found: ignore

  python-test:
    name: Python control plane
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator and pytest
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator python3-pytest
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build the co-simulation server
        run: cmake --build build --target axil_server --parallel "$(nproc)"
      - name: Run Python tests
        run: make python-test

  formal:
    name: Formal verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SymbiYosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
          pip install git+https://github.com/YosysHQ/sby
          pip install z3-solver
      - name: Run formal proofs
        run: make formal
      - name: Upload formal logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: formal-logs
          path: build/formal/
          if-no-files-found: ignore

  synth:
    name: Vivado synthesis
    runs-on: ubuntu-latest
    if: false  # enabled in Phase 11 (Artix-7 XC7A35T)
    steps: []
